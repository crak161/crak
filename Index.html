<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Mobile Chess</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    /* CSS Variables for instant Theme Switching */
    :root {
      --bg-color: #161512;
      --panel-bg: #262421;
      --light-sq: #ebecd0;
      --dark-sq: #739552;
      --highlight: rgba(255, 255, 51, 0.5);
      --accent: #81b64c;
    }
    body.theme-wood {
      --bg-color: #1f1712;
      --panel-bg: #2e221b;
      --light-sq: #f0d9b5;
      --dark-sq: #b58863;
      --accent: #d98a4e;
    }
    body.theme-neon {
      --bg-color: #0f1020;
      --panel-bg: #1b1d36;
      --light-sq: #cbd5e1;
      --dark-sq: #4f46e5;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-color);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      transition: background 0.3s ease;
    }

    .header {
      width: 92vw;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    h1 { font-size: 1.2rem; letter-spacing: 0.5px; }
    #status {
      font-size: 0.9rem;
      color: #e2e8f0;
      background: var(--panel-bg);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* Captured pieces bars */
    .tray {
      width: 92vw;
      max-width: 400px;
      height: 28px;
      background: var(--panel-bg);
      border-radius: 6px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 5px 0;
      font-size: 0.85rem;
    }
    .tray-pieces { display: flex; align-items: center; gap: 2px; height: 20px; }
    .tray-pieces svg { width: 18px; height: 18px; }
    .score-badge { color: var(--accent); font-weight: bold; }

    /* Locked 8x8 Grid */
    #board {
      display: grid;
      grid-template-columns: repeat(8, 12.5%);
      grid-template-rows: repeat(8, 12.5%);
      width: 92vw;
      height: 92vw;
      max-width: 400px;
      max-height: 400px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.6);
    }
    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .square svg {
      width: 80%;
      height: 80%;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
      transition: transform 0.12s ease;
    }
    .square.selected svg { transform: scale(1.1); }

    .light { background: var(--light-sq); color: var(--dark-sq); }
    .dark  { background: var(--dark-sq); color: var(--light-sq); }
    .selected, .last-move { background-image: linear-gradient(var(--highlight), var(--highlight)); }

    /* Pulsing red glow when King is in check */
    .in-check {
      background-image: radial-gradient(circle, rgba(239,68,68,0.95) 15%, rgba(220,38,38,0.4) 65%, transparent 80%) !important;
    }

    /* Board coordinates (a-h, 1-8) */
    .coord-rank {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
    }
    .coord-file {
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
    }

    /* Legal move dots & capture rings */
    .hint::after {
      content: "";
      width: 28%;
      height: 28%;
      background: rgba(0, 0, 0, 0.22);
      border-radius: 50%;
      position: absolute;
    }
    .capture-hint::after {
      content: "";
      width: 84%;
      height: 84%;
      border: 4px solid rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      position: absolute;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      width: 92vw;
      max-width: 400px;
    }
    select, button {
      padding: 11px 6px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    select { background: var(--panel-bg); color: #fff; text-align: center; }
    button { background: var(--accent); color: #fff; }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="header">
    <h1>CHESS AI</h1>
    <div id="status">Your Turn</div>
  </div>

  <!-- AI Captured Pieces Tray -->
  <div class="tray">
    <div class="tray-pieces" id="ai-captured"></div>
    <div class="score-badge" id="ai-score"></div>
  </div>

  <div id="board"></div>

  <!-- Player Captured Pieces Tray -->
  <div class="tray">
    <div class="tray-pieces" id="player-captured"></div>
    <div class="score-badge" id="player-score"></div>
  </div>

  <div class="controls">
    <select id="theme" onchange="changeTheme(this.value)">
      <option value="">Green Board</option>
      <option value="theme-wood">Wood Board</option>
      <option value="theme-neon">Neon Board</option>
    </select>
    <select id="difficulty">
      <option value="1">AI: Easy</option>
      <option value="2" selected>AI: Medium</option>
      <option value="3">AI: Hard</option>
    </select>
    <button onclick="resetGame()">New Game</button>
  </div>

  <script>
    const game = new Chess();
    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('board');
    const diffEl = document.getElementById('difficulty');

    let selectedSquare = null;
    let legalMoves = [];
    let lastMove = null;
    let aiThinking = false;

    const pieceSVGs = {

      bP: `<svg viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#222" stroke="#111" stroke-width="2" stroke-linecap="round"/></svg>`,
      wR: `<svg viewBox="0 0 45 45"><g fill="#fff" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none"/></g></svg>`,
      bR: `<svg viewBox="0 0 45 45"><g fill="#222" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12.5 32l1.5-2.5h17l1.5 2.5h-20zM12 36v-4h21v4H12z"/><path d="M14 29.5v-13h17v13H14z"/><path d="M14 16.5L11 14h23l-3 2.5H14zM11 14V9h4v2h5V9h5v2h5V9h4v5H11z"/><path d="M12 35.5h21M13 31.5h19M14 29.5h17M14 16.5h17M11 14h23" fill="none" stroke="#fff" stroke-width="1"/></g></svg>`,
      wN: `<svg viewBox="0 0 45 45"><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#fff"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3" fill="#fff"/><circle cx="14.5" cy="15.5" r="1" fill="#111"/></g></svg>`,
      bN: `<svg viewBox="0 0 45 45"><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#222"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3" fill="#222"/><circle cx="14.5" cy="15.5" r="1.2" fill="#fff" stroke="none"/><path d="M24.55 10.4l-.45 1.45.5.15c3.15 1 5.65 2.49 7.9 6.75S35.75 29.06 35.25 39l-.05.5h2.25l.05-.5c.5-10.06-.88-16.85-3.25-21.34-2.37-4.49-5.79-6.64-9.19-7.16l-.51-.1z" fill="#fff" stroke="none"/></g></svg>`,
      wB: `<svg viewBox="0 0 45 45"><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="#fff"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.354.49-2.323.47-3-.5 1.354-1.94 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><circle cx="22.5" cy="8" r="2.5"/></g><path d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/></g></svg>`,
      bB: `<svg viewBox="0 0 45 45"><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="#222"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.354.49-2.323.47-3-.5 1.354-1.94 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><circle cx="22.5" cy="8" r="2.5"/></g><path d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5" stroke="#fff" stroke-width="1.5"/></g></svg>`,
      wQ: `<svg viewBox="0 0 45 45"><g fill="#fff" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.2"/><circle cx="14" cy="9" r="2.2"/><circle cx="22.5" cy="8" r="2.2"/><circle cx="31" cy="9" r="2.2"/><circle cx="39" cy="12" r="2.2"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.1-5.2 13.6-3-14.5-3 14.5-5.2-13.6L14 25 6.5 13.5 9 26z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/></g></svg>`,
      bQ: `<svg viewBox="0 0 45 45"><g fill="#222" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.2"/><circle cx="14" cy="9" r="2.2"/><circle cx="22.5" cy="8" r="2.2"/><circle cx="31" cy="9" r="2.2"/><circle cx="39" cy="12" r="2.2"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.1-5.2 13.6-3-14.5-3 14.5-5.2-13.6L14 25 6.5 13.5 9 26z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0" fill="none" stroke="#fff" stroke-width="1.2"/></g></svg>`,
      wK: `<svg viewBox="0 0 45 45"><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#fff"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z" fill="#fff"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`,
      bK: `<svg viewBox="0 0 45 45"><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#222"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z" fill="#222"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0" stroke="#fff" stroke-width="1.2"/></g></svg>`
    };

    const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    const simpleVal = { p: 1, n: 3, b: 3, r: 5, q: 9 };

    function changeTheme(themeClass) {
      document.body.className = themeClass;
    }

    function renderBoard() {
      gridEl.innerHTML = '';
      const board = game.board();
      const inCheck = game.in_check();
      const turn = game.turn();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = String.fromCharCode(97 + c) + (8 - r);
          const sqDiv = document.createElement('div');
          sqDiv.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');

          if (selectedSquare === sqName) sqDiv.classList.add('selected');
          if (lastMove && (lastMove.from === sqName || lastMove.to === sqName)) {
            sqDiv.classList.add('last-move');
          }

          const moveHint = legalMoves.find(m => m.to === sqName);
          if (moveHint) {
            sqDiv.classList.add(moveHint.captured ? 'capture-hint' : 'hint');
          }

          // Coordinates on left edge & bottom edge
          if (c === 0) {
            const rankSpan = document.createElement('span');
            rankSpan.className = 'coord-rank';
            rankSpan.textContent = 8 - r;
            sqDiv.appendChild(rankSpan);
          }
          if (r === 7) {
            const fileSpan = document.createElement('span');
            fileSpan.className = 'coord-file';
            fileSpan.textContent = String.fromCharCode(97 + c);
            sqDiv.appendChild(fileSpan);
          }

          const piece = board[r][c];
          if (piece) {
            if (inCheck && piece.type === 'k' && piece.color === turn) {
              sqDiv.classList.add('in-check');
            }
            const key = piece.color + piece.type.toUpperCase();
            sqDiv.insertAdjacentHTML('beforeend', pieceSVGs[key]);
          }

          sqDiv.addEventListener('click', () => onSquareClick(sqName));
          gridEl.appendChild(sqDiv);
        }
      }
      updateCapturedTrays();
      updateStatus();
    }

    function updateCapturedTrays() {
      const history = game.history({ verbose: true });
      const whiteCaptured = []; // Black pieces taken by White
      const blackCaptured = []; // White pieces taken by Black
      let whiteMat = 0, blackMat = 0;

      for (let m of history) {
        if (m.captured) {
          if (m.color === 'w') {
            whiteCaptured.push('b' + m.captured.toUpperCase());
            whiteMat += simpleVal[m.captured] || 0;
          } else {
            blackCaptured.push('w' + m.captured.toUpperCase());
            blackMat += simpleVal[m.captured] || 0;
          }
        }
      }

      document.getElementById('player-captured').innerHTML = whiteCaptured.map(k => pieceSVGs[k]).join('');
      document.getElementById('ai-captured').innerHTML = blackCaptured.map(k => pieceSVGs[k]).join('');

      const diff = whiteMat - blackMat;
      document.getElementById('player-score').textContent = diff > 0 ? `+${diff}` : '';
      document.getElementById('ai-score').textContent = diff < 0 ? `+${Math.abs(diff)}` : '';
    }

    function onSquareClick(sq) {
      if (aiThinking || game.game_over() || game.turn() !== 'w') return;

      const chosenMove = legalMoves.find(m => m.to === sq);
      if (chosenMove) {
        lastMove = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
        selectedSquare = null;
        legalMoves = [];
        renderBoard();

        if (!game.game_over()) {
          aiThinking = true;
          statusEl.textContent = 'AI Thinking...';
          setTimeout(makeAIMove, 250);
        }
        return;
      }

      const piece = game.get(sq);
      if (piece && piece.color === 'w') {
        selectedSquare = sq;
        legalMoves = game.moves({ square: sq, verbose: true });
      } else {
        selectedSquare = null;
        legalMoves = [];
      }
      renderBoard();
    }

    function evaluateBoard() {
      let total = 0;
      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p) {
            const centerBonus = (r >= 2 && r <= 5 && c >= 2 && c <= 5) ? 15 : 0;
            const val = pieceValues[p.type] + centerBonus;
            total += p.color === 'b' ? val : -val;
          }
        }
      }
      return total;
    }

    function minimax(depth, alpha, beta, isMaximizing) {
      if (depth === 0 || game.game_over()) return evaluateBoard();

      const moves = game.moves();
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let m of moves) {
          game.move(m);
          const ev = minimax(depth - 1, alpha, beta, false);
          game.undo();
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let m of moves) {
          game.move(m);
          const ev = minimax(depth - 1, alpha, beta, true);
          game.undo();
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function makeAIMove() {
      const depth = parseInt(diffEl.value);
      const moves = game.moves({ verbose: true });
      moves.sort(() => Math.random() - 0.5);

      let bestMove = null;
      let bestValue = -Infinity;

      for (let m of moves) {
        game.move(m);
        const boardVal = minimax(depth - 1, -Infinity, Infinity, false);
        game.undo();
        if (boardVal > bestValue) {
          bestValue = boardVal;
          bestMove = m;
        }
      }

      if (bestMove) {
        lastMove = game.move(bestMove);
      }
      aiThinking = false;
      renderBoard();
    }

    function updateStatus() {
      if (game.in_checkmate()) {
        statusEl.textContent = game.turn() === 'w' ? 'Checkmate! AI Wins' : 'Checkmate! You Win!';
      } else if (game.in_draw()) {
        statusEl.textContent = 'Draw!';
      } else if (game.turn() === 'w') {
        statusEl.textContent = game.in_check() ? 'Check! Your Turn' : 'Your Turn';
      }
    }

    function resetGame() {
      game.reset();
      selectedSquare = null;
      legalMoves = [];
      lastMove = null;
      aiThinking = false;
      renderBoard();
    }

    renderBoard();
  </script>
</body>
</html>
